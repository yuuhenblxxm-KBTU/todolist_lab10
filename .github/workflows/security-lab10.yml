name: Lab 10 Security Checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install bandit semgrep pip-audit

      - name: Run existing tests
        run: python -m pytest -q

      - name: Check centralized secret
        env:
          KEY: ${{ secrets.KEY }}
          DB_NAME: todolist.db
        run: |
          python -c "import os; from app import create_app; key = os.environ.get('KEY'); assert key, 'KEY is missing'; assert create_app().config['SECRET_KEY'] == key; print('GitHub secret successfully loaded')"

      - name: Build application archive
        run: |
          python -m compileall -q app run.py
          mkdir -p dist
          python -m zipfile -c dist/todolist-app.zip app run.py requirements.txt .env.example
          python -m zipfile -t dist/todolist-app.zip

      - name: Create reports folder
        run: mkdir -p reports

      - name: SAST 1 - Bandit
        run: bandit -r app -f json -o reports/bandit.json
        continue-on-error: true

      - name: SAST 2 - Semgrep
        run: semgrep scan --config p/python --metrics=off --json --output reports/semgrep.json app run.py
        continue-on-error: true

      - name: SCA - pip-audit
        run: pip-audit -r requirements.txt -f json -o reports/pip-audit.json
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn

      - name: Upload application build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: dist/
          if-no-files-found: warn