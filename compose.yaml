
name: lab12

services:
  app:
    build: .
    image: sssd-lab12-todolist:local

    environment:
      KEY: ${KEY:?Set KEY in .env}
      DB_NAME: /app/instance/todolist.db
      DEBUG: "false"

    expose:
      - "8000"

    networks:
      - backend

    read_only: true

    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m

    volumes:
      - app_data:/app/instance

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    pids_limit: 128

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/readiness', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  waf:
    image: owasp/modsecurity-crs:nginx

    environment:
      BACKEND: http://app:8000
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
      MODSEC_AUDIT_LOG_PARTS: "AHFZ"

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      app:
        condition: service_healthy

    networks:
      - backend
      - edge

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    networks:
      - backend
      - monitoring

    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0

    command:
      - -config.file=/etc/loki/loki-local-config.yaml

    volumes:
      - ./monitoring/loki-local-config.yaml:/etc/loki/loki-local-config.yaml:ro

    networks:
      - monitoring

    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest

    command:
      - run
      - /etc/alloy/config.alloy

    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - monitoring

    depends_on:
      - loki

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - graf_data:/var/lib/grafana

    networks:
      - monitoring

    depends_on:
      - prometheus
      - loki

    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true
  monitoring:

volumes:
  app_data:
  prom_data:
  graf_data:
